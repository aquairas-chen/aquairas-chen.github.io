async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---- WGS-84 → GCJ-02（国测局纠偏，大陆高德数据必须转换） ---- */
const PI84=3.14159265358979324,AXIS84=6378245.0,EE84=0.00669342162296594323;
const outCN=(lat,lng)=>lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271;
function tLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI84)+20*Math.sin(2*x*PI84))*2/3;r+=(20*Math.sin(y*PI84)+40*Math.sin(y/3*PI84))*2/3;r+=(160*Math.sin(y/12*PI84)+320*Math.sin(y*PI84/30))*2/3;return r;}
function tLng(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI84)+20*Math.sin(2*x*PI84))*2/3;r+=(20*Math.sin(x*PI84)+40*Math.sin(x/3*PI84))*2/3;r+=(150*Math.sin(x/12*PI84)+300*Math.sin(x/30*PI84))*2/3;return r;}
function wgs2gcj(lat,lng){
  if(outCN(lat,lng))return[lat,lng];
  let dLat=tLat(lng-105,lat-35),dLng=tLng(lng-105,lat-35);
  const rad=lat/180*PI84;let mg=Math.sin(rad);mg=1-EE84*mg*mg;const sq=Math.sqrt(mg);
  dLat=(dLat*180)/((AXIS84*(1-EE84))/(mg*sq)*PI84);
  dLng=(dLng*180)/(AXIS84/sq*Math.cos(rad)*PI84);
  return[lat+dLat,lng+dLng];
}

/* ---- 分享链接密钥加解密（AES-GCM + PBKDF2，密钥不出本机） ---- */
async function pbkdf(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:60000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encKeys(pw,obj){
  const salt=crypto.getRandomValues(new Uint8Array(12)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await pbkdf(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)));
  const buf=new Uint8Array(24+ct.byteLength);buf.set(salt,0);buf.set(iv,12);buf.set(new Uint8Array(ct),24);
  let s='';for(let i=0;i<buf.length;i++)s+=String.fromCharCode(buf[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function decKeys(pw,s){
  try{
    const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/'));
    const raw=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)raw[i]=bin.charCodeAt(i);
    const k=await pbkdf(pw,raw.slice(0,12));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(12,24)},k,raw.slice(24));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null;}
}

const T2B=new Map();for(const b of BUCKETS)for(const t of b.types)T2B.set(t,b.id);
function bucketOf(p){
  const raw=p.displayName&&p.displayName.text||'';const nm=raw.toLowerCase();
  for(const b of BUCKETS){
    if(b.kwExc&&b.kwExc.some(k=>nm.includes(k.toLowerCase())))continue;
    if(b.kw&&b.kw.some(k=>nm.includes(k.toLowerCase())))return b.id;
    if(b.kwSuf&&b.kwSuf.some(k=>raw.trimEnd().endsWith(k)))return b.id;
  }
  for(const t of p.types||[]){const id=T2B.get(t);if(id)return id;}
  return'other';
}
const bayes=(r,c,m=15,C=4.1)=>!r?0:(c/(c+m))*r+(m/(c+m))*C;
function pickReview(rs){
  if(!rs||!rs.length)return null;
  const best=[...rs].sort((a,b)=>(b.rating||0)-(a.rating||0))[0];
  const t=best&&best.text&&best.text.text||'';
  if(!t)return null;
  return {text:t.length>140?t.slice(0,140)+'…':t,author:(best.authorAttribution&&best.authorAttribution.displayName)||'Google 用户'};
}
function todayHours(oh,lng){
  if(!oh)return null;
  if(oh.weekdayDescriptions&&oh.weekdayDescriptions.length){
    const d=new Date(Date.now()+(lng/15)*3600e3);
    return oh.weekdayDescriptions[(d.getUTCDay()+6)%7]||oh.weekdayDescriptions[0];
  }
  return oh.openNow!=null?(oh.openNow?'营业中':'已打烊'):null;
}

function shapePlaces(raw,lat,lng,region){

    const it={
      id:p.id,name,bucket:bid,
      rating:p.rating!=null?p.rating:null,
      ratingCount:p.userRatingCount||0,
      score:Math.round(bayes(p.rating,p.userRatingCount||0)*100)/100,
      openNow:p.currentOpeningHours?p.currentOpeningHours.openNow!=null?p.currentOpeningHours.openNow:null:null,

      mapsUrl:p.googleMapsUri||null,

const FIELD_MASK=['places.id','places.displayName','places.primaryType','places.types','places.rating','places.userRatingCount','places.currentOpeningHours','places.reviews','places.formattedAddress','places.location','places.googleMapsUri','places.priceLevel','places.photos'].join(',');
const cache=new Map();
const CACHE_TTL=6*3600e3;
const cGet=k=>{const h=cache.get(k);return h&&Date.now()-h.t<CACHE_TTL?h.v:null};
const cSet=(k,v)=>cache.set(k,{t:Date.now(),v});

async function fetchNearby(lat,lng,radius){
  const key=localStorage.getItem(LS.gkey)||'';

const PROXY='https://xjpzdbhgfzstocscofzo.supabase.co/functions/v1/nearbite/places';
async function callPlaces(key,lat,lng,radius){
  const payload={includedTypes:PLACE_TYPES,maxResultCount:20,rankPreference:'POPULARITY',locationRestriction:{circle:{center:{latitude:lat,longitude:lng},radius:radius}}};
  try{
    return await gCall('https://places.googleapis.com/v1/places:searchNearby',key,payload,false);
  }catch(e){
    if(e&&e.net){return await gCall(PROXY,key,payload,true);}
    throw e;
  }
}
async function gCall(url,key,payload,proxy){
  let resp;
  const headers=proxy?{'Content-Type':'application/json'}:{'Content-Type':'application/json','X-Goog-Api-Key':key,'X-Goog-FieldMask':FIELD_MASK};
  const body=proxy?JSON.stringify({key:key,fieldMask:FIELD_MASK,payload:payload}):JSON.stringify(payload);
  try{resp=await fetch(url,{method:'POST',headers:headers,body:body});}
  catch(e){const err=new Error('浏览器无法直连 Google，正在通过云端中转重试…');err.net=true;throw err;}
  if(!resp.ok){
    const b=await resp.text().catch(()=> '');
    if(resp.status===400&&/API key/i.test(b))throw new Error('Google API Key 无效 — 点击右上角 ⚙ 检查');
    if(resp.status===403)throw new Error('Google Places 调用被拒绝（403）— 请确认已启用 Places API (New) 并开通计费；Key 建议不加“网站限制”（否则会挡住云端中转）');
    throw new Error('Google Places '+resp.status+': '+b.slice(0,120));
  }
  return await resp.json();
}
const AMAP_PROXY='https://xjpzdbhgfzstocscofzo.supabase.co/functions/v1/nearbite/amap';
async function amapPage(key,loc,radius,pg){
  const qs='key='+enc(key)+'&location='+loc+'&radius='+radius+'&types=050000&offset=25&page='+pg+'&extensions=all&sortrule=distance&output=json';
  try{
    const resp=await fetch('https://restapi.amap.com/v3/place/around?'+qs);
    if(resp.ok)return await resp.json();
    throw new Error('高德接口 '+resp.status);
  }catch(e){
    try{
      const resp2=await fetch(AMAP_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key,location:loc,radius:radius,page:pg})});
      if(resp2.ok)return await resp2.json();
    }catch(e2){}
    throw e;
  }
}
async function fetchAmap(lat,lng,radius){
  const key=localStorage.getItem(LS.akey)||'';
  const ck='am'+roundC(lat)+','+roundC(lng)+','+radius;
  const hit=cGet(ck);
  if(hit)return{data:hit,cached:true};
  const gl=wgs2gcj(lat,lng);
  const loc=gl[1]+','+gl[0];
  const pages=radius>=3000?3:radius>=2000?2:1;
  const jobs=[];
  for(let pg=1;pg<=pages;pg++)jobs.push(amapPage(key,loc,radius,pg));
  const results=await Promise.all(jobs);
  if(!results.length||results[0].status!=='1'){
    const info=results[0]&&(results[0].info||'')||'未知';
    const code=results[0]&&(results[0].infocode||'')||'';
    throw new Error('高德接口报错：'+info+'（'+code+'）— 请确认 ⚙ 里的高德 Key 是「Web服务」类型且未设白名单');
  }
  const merged={status:'1',pois:[]};const seen=new Set();
  for(const j of results){
    if(j.status==='1'&&j.pois)for(const p of j.pois){if(p.id&&!seen.has(p.id)){seen.add(p.id);merged.pois.push(p);}}
  }
  cSet(ck,merged);
  return{data:merged,cached:false};
}

  const st=radii[activeRadius];
  if(st.status==='loading'){el.innerHTML='<div class="state"><div class="spin"></div></div>';return;}
  if(st.status==='error'){el.innerHTML='<div class="apierr"><p class="m">'+esc(st.message)+'</p></div>';return;}
  if(!st.cats.length){el.innerHTML='<div class="state"><p>这个范围内没有找到餐厅。</p></div>';return;}
  el.innerHTML=st.cats.map(c=>'<section class="cat"><div class="cat-head"><h2>'+esc(c.label)+'</h2><span>'+c.items.length+' 家 · '+(st.sort==='dist'?'按距离排序 · 评分点点评链接':'按 Google 评分加权排序')+'</span></div>'+c.items.map((p,i)=>placeHTML(p,i+1)).join('')+'</section>').join('');
}
function placeHTML(p,rank){
  let h='<div class="place"><div class="rank'+(rank<=3?' top':'')+'">'+rank+'</div><div class="p-body">';
  h+='<div><span class="p-name">'+esc(p.name)+'</span>';
  if(p.distance!=null)h+='<span class="p-dist">'+ICON_PIN+' '+fmtD(p.distance)+fmtW(p.distance)+'</span>';
  h+='</div><div class="p-meta">';
  if(p.rating!=null)h+='<span class="star">★</span><span><b>'+p.rating.toFixed(1)+'</b></span><span class="cnt">('+p.ratingCount+' 条评价)</span>';
  else h+='<span class="cnt">暂无评分</span>';
  if(p.priceLevel&&PRICE[p.priceLevel])h+='<span class="cnt">· '+PRICE[p.priceLevel]+'</span>';
  if(p.openNow!=null)h+='<span class="'+(p.openNow?'open':'closed')+'">· '+(p.openNow?'营业中':'已打烊')+'</span>';
  h+='</div>';
  if(p.hoursToday)h+='<p class="p-hours">'+esc(p.hoursToday)+'</p>';
  if(p.address)h+='<p class="p-hours">'+esc(p.address)+(p.tel?' · '+esc(p.tel):'')+'</p>';
  if(p.review)h+='<blockquote class="p-review">“'+esc(p.review.text)+'”<span class="who">— '+esc(p.review.author)+'</span></blockquote>';
  if(p.photo)h+='<img class="p-photo" src="'+esc(p.photo.small)+'" data-big="'+esc(p.photo.big)+'" loading="lazy" alt="照片" onerror="this.style.display=\'none\'">';
  h+='<div class="p-links">';
  if(p.mapsUrl)h+='<a class="primary" href="'+esc(p.mapsUrl)+'" target="_blank" rel="noreferrer">'+esc(p.mapsLabel||'Google 地图')+' ↗</a>';
  (p.localLinks||[]).forEach(l=>{h+='<a href="'+esc(l.url)+'" target="_blank" rel="noreferrer">'+esc(l.label)+' ↗</a>';});
  return h+'</div></div></div>';
}
function locate(){
  shell();geo=null;render();
  if(!navigator.geolocation){geo={error:'此浏览器不支持定位'};render();return;}
  navigator.geolocation.getCurrentPosition(
    p=>{geo={lat:p.coords.latitude,lng:p.coords.longitude};startFetch();},
    e=>{geo={error:e.code===1?'定位权限被拒绝 — 请在浏览器设置中允许本站使用位置，然后点击重新定位':'定位失败：'+e.message};render();},
    {enableHighAccuracy:true,timeout:20000,maximumAge:60000}
  );
}
function startFetch(){
  const id=++runId;const {lat,lng}=geo;
  RADII.forEach(r=>{radii[r]={status:'loading'};});
  render();
  const region=detectRegion(lat,lng);
  const useAmap=region==='CN'&&!!(localStorage.getItem(LS.akey)||'');
  RADII.forEach(r=>{
    const job=useAmap
      ?fetchAmap(lat,lng,r).then(res=>({cats:shapeAmap(res.data,lat,lng),cached:res.cached,sort:'dist'}))
      :fetchNearby(lat,lng,r).then(res=>({cats:shapePlaces(res.data,lat,lng,region),cached:res.cached,sort:'score'}));
    job.then(x=>{if(id!==runId)return;radii[r]={status:'ready',cats:x.cats,cached:x.cached,sort:x.sort};render();})
       .catch(err=>{if(id!==runId)return;radii[r]={status:'error',message:err.message};render();});
  });
}
function boot(){
  if(shareToken()){viewLock('');return;}
  if(localStorage.getItem(LS.ok)!=='1'){viewLock('');return;}
  locate();
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot();
</script>
</body>
